name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The deploy key on the server is restricted (via a `command=`
          # forced-command in authorized_keys) to only ever run deploy.sh,
          # regardless of what's sent here - this script string is kept for
          # clarity/debuggability, not because it controls what executes.
          script: /home/btcwallet/btcs-faucet/deploy.sh
